name: E2E Tests

on:
  push:
    branches: [main]

concurrency:
  group: e2e-main
  cancel-in-progress: true

env:
  API_URL: http://localhost:8080
  UI_URL: http://localhost:5173

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Clone API repo
        uses: actions/checkout@v4
        with:
          repository: abdelaziz-ebourki/system-gestion-soutenance-api
          path: api
          ref: main

      - name: Clone UI repo
        uses: actions/checkout@v4
        with:
          repository: abdelaziz-ebourki/system-gestion-soutenance-ui
          path: ui
          ref: main

      - name: Build & start API
        working-directory: api/api
        run: |
          ./mvnw -q package -DskipTests -Dspring.profiles.active=test &
          echo "Building API in background..."
          sleep 5

      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Start API
        run: |
          java -jar api/api/target/*.jar --spring.profiles.active=test &
          echo "Waiting for API to be ready..."
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8080 && break
            sleep 2
          done
          echo "API is ready"

      - name: Start UI preview
        working-directory: ui
        run: |
          npx vite preview --port 5173 --host 0.0.0.0 &
          echo "Waiting for UI to be ready..."
          for i in $(seq 1 15); do
            curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 && break
            sleep 2
          done
          echo "UI is ready"

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
